<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245b68">
  <title>沖縄旅行｜3泊4日プラン</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container app-container py-3">
      <div class="eyebrow">MY OKINAWA TRIP</div>
      <h1 class="h3 mb-1">沖縄旅行 <span aria-hidden="true">🌺</span></h1>
    </div>
  </header>

  <main class="container app-container pb-nav">
    <section id="page-home" class="page-section active">
      <div class="section-heading mt-3">
        <div><div class="eyebrow text-teal">QUICK ACCESS</div><h2 class="h5 mb-0">すぐに確認</h2></div>
        <span class="small text-muted">閲覧専用</span>
      </div>
      <div class="row g-2 mt-1" id="quickCards"></div>
      <div class="section-heading mt-4">
        <div><div class="eyebrow text-teal">NEXT SCHEDULE</div><h2 class="h5 mb-0">旅行スケジュール</h2></div>
        <button class="btn btn-sm btn-outline-teal" data-go="itinerary">すべて見る</button>
      </div>
      <div class="day-pills mt-3" id="homeDayPills"></div>
      <div id="homeSchedule" class="mt-3"></div>
      <div class="section-heading mt-4">
        <div><div class="eyebrow text-teal">STAY</div><h2 class="h5 mb-0">宿泊先</h2></div>
      </div>
      <div id="hotelCard" class="mt-2"></div>
    </section>

    <section id="page-itinerary" class="page-section">
      <div class="page-title">
        <div class="eyebrow text-teal">DAILY PLAN</div><h2 class="h4 mb-1">旅程表</h2>
        <p class="text-muted small mb-0">日付を選んで予定を確認できます。</p>
      </div>
      <div class="day-pills mt-3" id="itineraryDayPills"></div>
      <div id="itineraryList" class="mt-3"></div>
    </section>

    <section id="page-transport" class="page-section">
      <div class="page-title">
        <div class="eyebrow text-teal">TRAIN & FLIGHT</div><h2 class="h4 mb-1">移動情報</h2>
        <p class="text-muted small mb-0">電車・飛行機・バスの時刻をまとめて確認。</p>
      </div>
      <div class="alert alert-soft small mt-3 mb-3"><i class="bi bi-info-circle me-1"></i>時刻は旅行計画に登録された内容です。</div>
      <div id="transportList"></div>
    </section>

    <section id="page-places" class="page-section">
      <div class="page-title">
        <div class="eyebrow text-teal">ADDRESS & CONTACT</div><h2 class="h4 mb-1">施設・連絡先</h2>
        <p class="text-muted small mb-0">住所・電話番号をすぐに確認できます。</p>
      </div>
      <div class="input-group mt-3 search-box">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control" id="placeSearch" placeholder="施設名・住所で検索">
      </div>
      <div id="placesList" class="mt-3"></div>
    </section>

    <section id="page-manage" class="page-section">
      <div class="page-title">
        <div class="eyebrow text-teal">TRIP DETAILS</div><h2 class="h4 mb-1">予算・持ち物</h2>
        <p class="text-muted small mb-0">旅行計画の予算と持ち物を確認できます。</p>
      </div>
      <div class="section-heading mt-4"><h3 class="h6 mb-0">予算</h3></div>
      <div id="budgetList" class="mt-2"></div>
      <div class="section-heading mt-4"><h3 class="h6 mb-0">持ち物</h3><span id="packingCount" class="small text-muted"></span></div>
      <div id="packingList" class="checklist-card mt-2"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="nav-item active" data-page="home"><i class="bi bi-house-door"></i><span>ホーム</span></button>
    <button class="nav-item" data-page="itinerary"><i class="bi bi-calendar3"></i><span>旅程</span></button>
    <button class="nav-item" data-page="transport"><i class="bi bi-train-front"></i><span>移動</span></button>
    <button class="nav-item" data-page="places"><i class="bi bi-geo-alt"></i><span>施設情報</span></button>
    <button class="nav-item" data-page="manage"><i class="bi bi-wallet2"></i><span>予算など</span></button>
  </nav>
  <script src="trip-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
